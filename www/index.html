<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#f5f7f6" />
<title>BauZeuge</title>
<link rel="stylesheet" href="stil.css" />
<link rel="icon" href="symbol.svg" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="symbol-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="BauZeuge" />
</head>
<body>
<header id="kopf">
  <button class="menue-knopf" id="menueknopf" type="button" aria-label="Menü"
    aria-expanded="false" aria-controls="seitenleiste">
    <span></span><span></span><span></span>
  </button>
  <button class="zurueck" id="zurueck" aria-label="Zurück" hidden>&#8249;</button>
  <a class="titel" id="kopftitel" href="#/" aria-label="Zur Projektübersicht"><span class="wortmarke"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="12" fill="#1f2a30"></rect><path d="M11 31 32 13 53 31Z" fill="#5fbabd"></path><rect x="16" y="31" width="32" height="20" fill="none" stroke="#f5f7f6" stroke-width="4"></rect><rect x="28" y="40" width="8" height="11" fill="#f5f7f6"></rect></svg><span class="wm-text">Bau<span class="wm-akzent">Zeuge</span><span class="wm-de">.de</span></span></span></a>
  <button class="kopf-aktion" id="kopfaktion" hidden></button>
  <div class="thema-schalter" id="themaschalter" role="group" aria-label="Design"></div>
</header>

<div id="rumpf">
  <nav id="seitenleiste" aria-label="Bereiche"></nav>
  <!-- Kein hidden-Attribut: Die Regel [hidden] traegt !important und liesse
       sich per CSS nicht mehr einblenden. Sichtbarkeit steuert die Klasse
       leiste-offen am body. -->
  <div id="leistenschatten"></div>
  <main id="inhalt" aria-live="polite"></main>
</div>

<script type="module">
  // Vor app.js: Das Design muss stehen, bevor der erste Bildschirm gezeichnet
  // wird, sonst blitzt beim Start kurz das helle auf.
  import { themaStarten, schalterAnbinden } from './thema.js';
  themaStarten();
  schalterAnbinden(document.getElementById('themaschalter'));
</script>
<script type="module" src="app.js"></script>

<script>
/*
 * Der Service Worker macht die Webfassung offline benutzbar und ist zugleich
 * die Bedingung dafuer, dass ein Browser "App installieren" anbietet statt
 * nur eine Verknuepfung.
 *
 * Er laeuft ausschliesslich auf den echten Webadressen. Im Android-Paket
 * liegt dieselbe Seite unter https://localhost; dort wuerde ein Arbeiter die
 * mitgelieferten Dateien zwischenspeichern und nach einer App-Aktualisierung
 * womoeglich die alten ausliefern. Beim oertlichen Entwickeln waere er
 * genauso im Weg: Eine Aenderung an einem Modul kaeme erst nach dem naechsten
 * Neuladen an, und man sucht den Fehler an der falschen Stelle.
 */
(function () {
  // Klein geschrieben, und das muss so bleiben: location.hostname ist immer klein.
  var wirte = ['www.bauzeuge.de', 'bauzeuge.de', 'www.bau-zeuge.de', 'bau-zeuge.de'];
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:') return;
  if (wirte.indexOf(location.hostname) === -1) return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (fehler) {
      console.warn('Service Worker nicht eingerichtet:', fehler);
    });
  });
})();
</script>
</body>
</html>
