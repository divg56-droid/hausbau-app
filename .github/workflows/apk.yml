# Baut das Android-Paket und haengt es an eine Veroeffentlichung.
#
# Warum im CI und nicht lokal: Der Ubuntu-Laeufer von GitHub bringt JDK und
# Android-SDK bereits mit. Damit muss auf keinem Arbeitsrechner ein Android
# Studio installiert werden, und der Bau laeuft bei jedem gleich ab.
#
# Der Ordner android/ ist bewusst nicht im Repository. Er wird bei jedem Lauf
# frisch aus capacitor.config.json erzeugt; so kann er nicht veralten.
name: APK bauen

on:
  push:
    branches: [main, master]
    # Eine Textaenderung soll kein neues Paket erzeugen: sonst waechst die
    # Buildnummer, und die Veroeffentlichung wird durch ein identisches APK
    # ersetzt. Greift nur, wenn ausschliesslich solche Dateien betroffen sind.
    paths-ignore:
      - '**.md'
      - 'ressourcen/symbol.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten
        run: npm ci

      - name: Rechenkerne prüfen
        run: node test.mjs

      # Erst die Android-Plattform anlegen, dann Symbole erzeugen: der
      # Symbolerzeuger schreibt in android/app/src/main/res.
      - name: Android-Plattform anlegen
        run: npx --yes cap add android

      # Solange die App mit nichts sprach, war das Manifest berechtigungsfrei
      # und Android verbot das Senden auf Betriebssystemebene. Mit dem
      # Abgleich braucht sie den Zugang wieder. Geprueft wird deshalb, dass
      # ausser INTERNET keine weitere Berechtigung hineingerutscht ist -
      # Kamera oder Standort haben hier nach wie vor nichts zu suchen.
      - name: Berechtigungen pruefen
        run: |
          manifest=android/app/src/main/AndroidManifest.xml
          unerwartet=$(grep -o 'android\.permission\.[A-Z_]*' "$manifest" | sort -u | grep -v '^android\.permission\.INTERNET$' || true)
          if [ -n "$unerwartet" ]; then
            echo "FEHLER: unerwartete Berechtigung im Manifest:" >&2
            echo "$unerwartet" >&2
            exit 1
          fi
          grep -q 'android.permission.INTERNET' "$manifest" || {
            echo "FEHLER: INTERNET fehlt, der Abgleich koennte nicht arbeiten." >&2
            exit 1
          }
          echo "Nur INTERNET, wie vorgesehen."

      # Nur Kosmetik: schlaegt der Symbolerzeuger fehl, entsteht trotzdem ein
      # brauchbares Paket, dann eben mit dem Capacitor-Standardsymbol.
      - name: Symbole und Startbild erzeugen
        continue-on-error: true
        run: |
          mkdir -p assets
          cp ressourcen/icon.png assets/icon.png
          cp ressourcen/splash.png assets/splash.png
          npx --yes @capacitor/assets@3 generate --android

      - name: Web-Dateien übernehmen
        run: npx --yes cap sync android

      - name: APK bauen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Umbenennen
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             bauzeuge-${{ github.run_number }}.apk
          ls -la bauzeuge-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bauzeuge-apk
          path: bauzeuge-*.apk
          retention-days: 30

      # Veroeffentlichung mit fester Marke: Der Link bleibt gleich, der Inhalt
      # wird ersetzt. So muss auf dem Telefon nur ein Lesezeichen bestehen.
      - name: Zum Herunterladen bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test --yes --cleanup-tag || true
          gh release create test \
            --title "Bauzeuge - Testversion" \
            --notes "Build ${{ github.run_number }} vom $(date +%d.%m.%Y). Debug-Paket zum Ausprobieren, nicht für den Play Store signiert. Zum Installieren auf dem Telefon unter Einstellungen die Installation aus unbekannten Quellen für den Browser erlauben." \
            --prerelease \
            bauzeuge-${{ github.run_number }}.apk
